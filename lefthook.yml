assert_lefthook_installed: true
extends:
  - node_modules/@ai-ecoverse/slicc-shared-web/lefthook.yml
pre-commit:
  jobs:
    - name: shared hooks
      run: test -f node_modules/@ai-ecoverse/slicc-shared-web/lefthook.yml || { echo 'slicc-shared-web hooks missing, run npm install'; exit 1; }
    - name: biome
      skip: true
    - name: typecheck
      skip: true
    - name: diff coverage
      skip: true
    - name: go
      glob: "*.{go,mod,sum}"
      run: >-
        snap=$(mktemp -d) && trap 'rm -rf "$snap"' EXIT &&
        git checkout-index -a --prefix="$snap/" &&
        cd "$snap" &&
        test -z "$(gofmt -l . | tee /dev/stderr)" && go mod tidy -diff && go vet ./...
