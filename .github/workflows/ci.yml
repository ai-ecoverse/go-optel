name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          install-only: true

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Major-version guard
        run: |
          node scripts/major-guard.mjs 0.9.0
          node scripts/major-guard.mjs 1.4.2
          if node scripts/major-guard.mjs 2.0.0; then
            echo "major-guard accepted 2.0.0 for a v1 module path"
            exit 1
          fi
          v2=$(mktemp -d)
          printf 'module github.com/ai-ecoverse/go-optel/v2\n' > "$v2/go.mod"
          (cd "$v2" && node "$GITHUB_WORKSPACE/scripts/major-guard.mjs" 2.1.0)
          for version in 1.5.0 3.0.0; do
            if (cd "$v2" && node "$GITHUB_WORKSPACE/scripts/major-guard.mjs" "$version"); then
              echo "major-guard accepted $version for a /v2 module path"
              exit 1
            fi
          done
