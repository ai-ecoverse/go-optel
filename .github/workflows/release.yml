name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - run: npm ci

      - run: npm test

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm the Go module proxy and pkg.go.dev
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          MODULE: github.com/ai-ecoverse/go-optel
        run: |
          tag=$(git -C "$GITHUB_WORKSPACE" tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo "no release tag on HEAD"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "$MODULE@$tag"; then
              break
            fi
            sleep $((attempt * 10))
          done
          curl -fsS -X POST --max-time 30 "https://pkg.go.dev/fetch/$MODULE@$tag" || true
